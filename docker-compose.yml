# FastAPI (OpenCV ONNX face recognition) + React kiosk/admin UI served by nginx.
#   Create a .env file next to this one with ADMIN_API_KEY and TEMPLATE_KEY (see README), then:
#   docker compose up --build
# Then open http://localhost:8080   (the camera works on localhost; elsewhere it needs HTTPS)
services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/faceattend.db
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY to a long random string}
      TEMPLATE_KEY: ${TEMPLATE_KEY:?Set TEMPLATE_KEY (32 random bytes, base64)}
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  data:
